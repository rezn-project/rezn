name: Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.0"
  # The Orqos commit whose workload API this Rezn targets.
  ORQOS_REF: b6dd86f599f13bf8b573e0c65d4084e1df8da19d

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    # Side by side: an Orqos checkout inside the Rezn workspace would be mistaken for a workspace member.
    - uses: actions/checkout@v4
      with:
        path: rezn
    - uses: actions/checkout@v4
      with:
        repository: orqos-project/orqos
        ref: ${{ env.ORQOS_REF }}
        path: orqos
    - name: Install build dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
    - name: Build Rezn
      run: cargo build --locked -p rezn --manifest-path rezn/Cargo.toml
    - name: Build Orqos
      run: cargo build --locked --manifest-path orqos/Cargo.toml
    - uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          rezn/target/debug/rezn
          orqos/target/debug/orqos
        retention-days: 1

  acceptance:
    # Podman 5 with Quadlet .pod units ships with Ubuntu 26.04.
    needs: build
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: binaries
        path: bin
    - name: Install Podman
      run: sudo apt-get update && sudo apt-get install -y podman
    - name: Give the containers user subordinate IDs for UserNS=auto
      run: |
        for file in /etc/subuid /etc/subgid; do
          grep -q '^containers:' "$file" || echo 'containers:2147483647:2147483648' | sudo tee -a "$file"
        done
    - name: Acceptance
      run: |
        chmod +x bin/rezn/target/debug/rezn bin/orqos/target/debug/orqos
        sudo python3 scripts/acceptance.py --orqos-bin bin/orqos/target/debug/orqos --rezn-bin bin/rezn/target/debug/rezn
    - name: Diagnostics
      if: failure()
      run: |
        sudo systemctl list-units 'orqos-*' --all --no-pager || true
        sudo journalctl -u 'orqos-*' --no-pager -n 200 || true
        sudo podman ps -a || true
