apiVersion: v1
kind: Pod
metadata: { name: rkp-sidecar }
spec:
  initContainers:
    - name: side
      image: docker.io/library/alpine:3.22
      restartPolicy: Always
      command: [sh, -c, "sleep 6; date +%s.%N > /shared/side-ready; sleep 20"]
      volumeMounts: [{ name: shared, mountPath: /shared }]
  containers:
    - { name: main, image: docker.io/library/alpine:3.22, command: [sh, -c, "date +%s.%N > /shared/main-start; sleep 600"], volumeMounts: [{ name: shared, mountPath: /shared }] }
  volumes: [{ name: shared, hostPath: { path: /tmp/rkp-t05-shared, type: DirectoryOrCreate } }]
