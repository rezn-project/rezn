apiVersion: v1
kind: Secret
metadata: { name: rkp-sec-s }
stringData: { client-secret-0: s3cr3t, password: pw }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rkp-cm }
data: { app.json: '{"a":1}', other.txt: other }
---
apiVersion: v1
kind: Pod
metadata: { name: rkp-secrets }
spec:
  securityContext: { runAsUser: 1654, runAsGroup: 1654 }
  containers:
    - name: main
      image: docker.io/library/alpine:3.22
      command: [sh, -c, "echo PW=$PW; ls -ln /run/client/ /run/items/; stat -Lc '%n %u:%g %a' /run/client/client-secret-0 /run/items/one /app/app.json; ls -la /run/client | head -5; cat /app/app.json; sleep 600"]
      env: [{ name: PW, valueFrom: { secretKeyRef: { name: rkp-sec-s, key: password } } }]
      volumeMounts:
        - { name: client, mountPath: /run/client, readOnly: true }
        - { name: items, mountPath: /run/items, readOnly: true }
        - { name: cfg, mountPath: /app/app.json, subPath: app.json, readOnly: true }
  volumes:
    - { name: client, secret: { secretName: rkp-sec-s, defaultMode: 0440 } }
    - { name: items, secret: { secretName: rkp-sec-s, items: [{ key: client-secret-0, path: one, mode: 0400 }] } }
    - { name: cfg, configMap: { name: rkp-cm } }
