apiVersion: v1
kind: Pod
metadata: { name: rkp-probe }
spec:
  containers:
    - name: web
      image: docker.io/library/alpine:3.22
      command: [sh, -c, "touch /tmp/started; while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok' | nc -l -p 8080 >/dev/null; done"]
      livenessProbe: { exec: { command: [sh, -c, "test -f /tmp/started"] }, periodSeconds: 5 }
      readinessProbe: { exec: { command: [sh, -c, "test -f /tmp/ready"] }, periodSeconds: 5 }
      startupProbe: { exec: { command: [sh, -c, "test -f /tmp/started"] }, periodSeconds: 2, failureThreshold: 10 }
    - name: http
      image: docker.io/library/alpine:3.22
      command: [sh, -c, "sleep 600"]
      livenessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 5 }
      readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5 }
