# Generic manifests that use every path in spec/kubernetes-subset.json (checked by scripts/test_spec.py).
apiVersion: v1
kind: Secret
metadata:
  name: db
  labels: { app.kubernetes.io/name: shop }
  annotations: { helm.sh/hook: pre-install, helm.sh/hook-weight: "-20", helm.sh/hook-delete-policy: before-hook-creation }
type: Opaque
data: { password: c2VjcmV0 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: settings, labels: { app.kubernetes.io/name: shop } }
data: { settings.json: '{"level":"info"}' }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: state }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations: { checksum/settings: 0123abcd }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api }, annotations: { checksum/settings: 0123abcd } }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets: [{ name: registry }]
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: prepare
          image: docker.io/library/alpine:3.22
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args: ["echo ready"]
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
        - name: credentials
          image: docker.io/library/alpine:3.22
          restartPolicy: Always
          startupProbe: { exec: { command: [test, -f, /tmp/token] }, periodSeconds: 5, failureThreshold: 30 }
      containers:
        - name: api
          image: registry.example.com/shop/api:1.0
          env:
            - { name: LEVEL, value: info }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db, key: password } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, runAsNonRoot: true }
          livenessProbe: { httpGet: { path: /health/live, port: http, scheme: HTTP }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /health/ready, port: http, scheme: HTTPS } }
          volumeMounts:
            - { name: settings, mountPath: /app/settings.json, subPath: settings.json, readOnly: true }
            - { name: tls, mountPath: /run/tls, readOnly: true }
            - { name: state, mountPath: /var/lib/api }
            - { name: tmp, mountPath: /tmp }
            - { name: mem, mountPath: /run/mem }
      volumes:
        - { name: settings, configMap: { name: settings, items: [{ key: settings.json, path: settings.json }] } }
        - { name: tls, secret: { secretName: api-tls, defaultMode: 288, items: [{ key: tls.crt, path: tls.crt }] } }
        - { name: state, persistentVolumeClaim: { claimName: state } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: mem, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db, annotations: { helm.sh/hook: "pre-install,pre-upgrade", helm.sh/hook-weight: "-10" } }
spec:
  replicas: 1
  serviceName: db
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy: { whenDeleted: Retain, whenScaled: Retain }
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready] } }
  volumeClaimTemplates:
    - metadata: { name: data, labels: { app: db } }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: seed, annotations: { helm.sh/hook: post-install } }
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app: seed } }
    spec:
      restartPolicy: Never
      containers: [{ name: seed, image: docker.io/library/alpine:3.22, command: [/bin/true] }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: backup }
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata: { labels: { app: backup } }
        spec:
          restartPolicy: OnFailure
          containers: [{ name: backup, image: docker.io/library/alpine:3.22, command: [/bin/true] }]
---
apiVersion: v1
kind: Service
metadata: { name: db }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app: db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: public }
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }] }
  tls: [{ hosts: [api.example.com], secretName: edge-tls }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db }
spec:
  podSelector: { matchLabels: { app: db } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }]
      ports: [{ port: 5432, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 10.0.0.0/8 } }, { podSelector: { matchLabels: { app: api } } }]
      ports: [{ port: 53, protocol: UDP }]
